services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cipipeline
      MYSQL_USER: ${DB_USERNAME:-cipipeline}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cipipeline?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-cipipeline}
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-password}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
